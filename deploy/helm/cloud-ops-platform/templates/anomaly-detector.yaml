apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-ops-anomaly-detector
  labels:
    {{- include "cloud-ops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloud-ops-anomaly-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-ops-anomaly-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-ops-anomaly-detector
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: anomaly-detector
          image: "{{ .Values.images.anomalyDetector.repository }}:{{ .Values.images.anomalyDetector.tag }}"
          imagePullPolicy: {{ .Values.images.anomalyDetector.pullPolicy }}
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.anomalyDetector.prometheusUrl | quote }}
            - name: TARGET_CONFIG
              value: /etc/anomaly-detector/targets.yaml
            - name: LOOKBACK_HOURS
              value: {{ .Values.anomalyDetector.lookbackHours | quote }}
            - name: QUERY_STEP_SECONDS
              value: {{ .Values.anomalyDetector.queryStepSeconds | quote }}
            - name: EVALUATION_INTERVAL_SECONDS
              value: {{ .Values.anomalyDetector.evaluationIntervalSeconds | quote }}
            - name: RETRAIN_INTERVAL_SECONDS
              value: {{ .Values.anomalyDetector.retrainIntervalSeconds | quote }}
            - name: MINIMUM_SAMPLES
              value: {{ .Values.anomalyDetector.minimumSamples | quote }}
            - name: CONTAMINATION
              value: {{ .Values.anomalyDetector.contamination | quote }}
            - name: ROLLING_WINDOW
              value: {{ .Values.anomalyDetector.rollingWindow | quote }}
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          volumeMounts:
            - name: targets
              mountPath: /etc/anomaly-detector
              readOnly: true
            - name: models
              mountPath: /var/lib/anomaly-detector
          resources:
            {{- toYaml .Values.anomalyDetector.resources | nindent 12 }}
      volumes:
        - name: targets
          configMap:
            name: cloud-ops-anomaly-targets
        - name: models
          persistentVolumeClaim:
            claimName: cloud-ops-anomaly-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud-ops-anomaly-models
  labels:
    {{- include "cloud-ops.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.anomalyDetector.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-ops-anomaly-detector
  labels:
    {{- include "cloud-ops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloud-ops-anomaly-detector
spec:
  selector:
    app.kubernetes.io/name: cloud-ops-anomaly-detector
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics

